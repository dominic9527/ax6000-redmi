name: Redmi AX6000 OpenWrt Build

on:
  workflow_dispatch:

  push:
    branches:
      - main
    paths:
      - 'ax6000.config'
      - 'diy-part1.sh'
      - 'diy-part2.sh'
      - '.github/workflows/build.yml'

permissions:
  contents: write

env:
  OPENWRT_REPO: https://github.com/openwrt/openwrt.git
  OPENWRT_TAG: v25.12.6

jobs:

  build:

    runs-on: ubuntu-24.04

    steps:

      # ---------------------------------------------------
      # 1. Checkout configuration repository
      # ---------------------------------------------------

      - name: Checkout configuration
        uses: actions/checkout@v4

      # ---------------------------------------------------
      # 2. Install build dependencies
      # ---------------------------------------------------

      - name: Install dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            build-essential \
            clang \
            flex \
            bison \
            g++ \
            gawk \
            gcc-multilib \
            g++-multilib \
            gettext \
            git \
            libncurses-dev \
            libssl-dev \
            python3 \
            python3-setuptools \
            python3-pyelftools \
            rsync \
            swig \
            unzip \
            zlib1g-dev \
            file \
            wget \
            curl \
            jq \
            time

      # ---------------------------------------------------
      # 3. Clone official OpenWrt
      # ---------------------------------------------------

      - name: Clone OpenWrt
        run: |
          git clone \
            --depth 1 \
            --branch "${OPENWRT_TAG}" \
            "${OPENWRT_REPO}" \
            openwrt

      # ---------------------------------------------------
      # 4. Update and install feeds
      # ---------------------------------------------------

      - name: Update feeds
        working-directory: openwrt
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      # ---------------------------------------------------
      # 5. Run DIY Part 1
      # ---------------------------------------------------

      - name: Run DIY Part 1
        working-directory: openwrt
        run: |
          chmod +x "$GITHUB_WORKSPACE/diy-part1.sh"
          "$GITHUB_WORKSPACE/diy-part1.sh"

      # ---------------------------------------------------
      # 6. Load configuration and run DIY Part 2
      # ---------------------------------------------------

      - name: Load configuration
        working-directory: openwrt
        run: |
          cp "$GITHUB_WORKSPACE/ax6000.config" .config

          chmod +x "$GITHUB_WORKSPACE/diy-part2.sh"
          "$GITHUB_WORKSPACE/diy-part2.sh"

      # ---------------------------------------------------
      # 7. Generate final configuration
      # ---------------------------------------------------

      - name: Generate defconfig
        working-directory: openwrt
        run: |
          make defconfig

          echo "========== Target check =========="

          grep -E \
            'CONFIG_TARGET_mediatek_filogic_DEVICE_xiaomi_redmi-router-ax6000-ubootmod=y' \
            .config

          echo "========== Package check =========="

          for package in \
            luci \
            luci-ssl \
            kmod-wireguard \
            wireguard-tools \
            tailscale \
            miniupnpd-nftables \
            lucky \
            luci-app-lucky \
            luci-theme-argon
          do
            if ! grep -q "^CONFIG_PACKAGE_${package}=y" .config; then
              echo "ERROR: Package not selected: ${package}"
              exit 1
            fi
          done

          echo "All required packages selected."

          echo "========== DAE check =========="

          if grep -q '^CONFIG_PACKAGE_dae=y' .config; then
            echo "ERROR: DAE should be installed independently."
            exit 1
          fi

          echo "DAE is not built into firmware."

      # ---------------------------------------------------
      # 8. Download sources
      # ---------------------------------------------------

      - name: Download sources
        working-directory: openwrt
        run: |
          make download -j8

      # ---------------------------------------------------
      # 9. Compile firmware
      # ---------------------------------------------------

      - name: Build firmware
        working-directory: openwrt
        run: |
          make -j"$(nproc)" V=s

      # ---------------------------------------------------
      # 10. Collect firmware
      # ---------------------------------------------------

      - name: Collect firmware
        run: |
          mkdir -p release

          find openwrt/bin/targets/mediatek/filogic \
            -type f \
            \( \
              -name '*ubootmod-preloader.bin' \
              -o -name '*ubootmod-bl31-uboot.fip' \
              -o -name '*ubootmod-initramfs-factory.ubi' \
              -o -name '*ubootmod-initramfs-recovery.itb' \
              -o -name '*ubootmod-squashfs-sysupgrade.itb' \
            \) \
            -exec cp -v {} release/ \;

          echo "========== Collected files =========="

          ls -lh release

          # Check all required artifacts

          required_files=(
            '*ubootmod-preloader.bin'
            '*ubootmod-bl31-uboot.fip'
            '*ubootmod-initramfs-factory.ubi'
            '*ubootmod-initramfs-recovery.itb'
            '*ubootmod-squashfs-sysupgrade.itb'
          )

          for pattern in "${required_files[@]}"; do
            if ! compgen -G "release/${pattern}" > /dev/null; then
              echo "ERROR: Missing artifact: ${pattern}"
              exit 1
            fi
          done

          echo "All required firmware artifacts found."

      # ---------------------------------------------------
      # 11. Build information and SHA256
      # ---------------------------------------------------

      - name: Generate build information
        run: |
          {
            echo "Device: Redmi AX6000 U-Boot Mod"
            echo "Target: mediatek/filogic"
            echo "Source: OpenWrt"
            echo "Version: ${OPENWRT_TAG}"
            echo "Build date: $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
            echo ""
            echo "Packages:"
            grep '^CONFIG_PACKAGE_.*=y' openwrt/.config | sort
          } > release/BUILD_INFO.txt

          cd release

          sha256sum * > SHA256SUMS

          cat SHA256SUMS

      # ---------------------------------------------------
      # 12. Upload artifact
      # ---------------------------------------------------

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Redmi-AX6000-OpenWrt-${{ env.OPENWRT_TAG }}
          path: release/*
          if-no-files-found: error
          retention-days: 30

      # ---------------------------------------------------
      # 13. Create GitHub Release
      # ---------------------------------------------------

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: AX6000-${{ env.OPENWRT_TAG }}-${{ github.run_number }}
          name: Redmi AX6000 OpenWrt ${{ env.OPENWRT_TAG }} Build ${{ github.run_number }}
          body: |
            ## Redmi AX6000 U-Boot Mod

            - Firmware: Official OpenWrt
            - Version: ${{ env.OPENWRT_TAG }}
            - Target: MediaTek Filogic
            - Device: Xiaomi Redmi Router AX6000 U-Boot Mod

            ### Included

            - WireGuard
            - Tailscale
            - UPnP
            - Lucky
            - Argon Theme
            - Chinese LuCI

            ### Independent installation

            DAE is not compiled into the firmware.
            It is maintained and updated independently.

            ### Notes

            PPPoE credentials and Wi-Fi passwords are not preconfigured.
            Root password must be configured after installation.

          files: release/*
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
