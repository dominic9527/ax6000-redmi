
name: Redmi AX6000 U-Boot Mod Build

on:
  workflow_dispatch:

  push:
    branches:
      - main
    paths:
      - '.config'
      - '.github/workflows/build.yml'

permissions:
  contents: write

jobs:
  build:
    name: AX6000 U-Boot Mod
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    env:
      OPENWRT_TAG: v25.12.6

    steps:

      # 1. Get your configuration repository
      - name: Checkout config
        uses: actions/checkout@v4

      # 2. Install dependencies
      - name: Install build dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            build-essential \
            clang \
            flex \
            bison \
            g++ \
            gawk \
            gcc-multilib \
            g++-multilib \
            gettext \
            git \
            libncurses-dev \
            libssl-dev \
            python3 \
            python3-setuptools \
            rsync \
            unzip \
            zlib1g-dev \
            file \
            wget \
            curl \
            ccache

      # 3. Clone official OpenWrt source
      - name: Clone OpenWrt
        run: |
          git clone \
            --depth 1 \
            --branch "$OPENWRT_TAG" \
            https://github.com/openwrt/openwrt.git \
            openwrt

      # 4. Update package feeds
      - name: Update feeds
        run: |
          cd openwrt

          ./scripts/feeds update -a
          ./scripts/feeds install -a

      # 5. Load configuration
      - name: Configure firmware
        run: |
          cp .config openwrt/.config

          cd openwrt

          make defconfig

          echo "===== Target check ====="

          grep -E \
            '^CONFIG_TARGET_mediatek_filogic_DEVICE_xiaomi_redmi-router-ax6000-ubootmod=y$' \
            .config

          echo "===== Initramfs check ====="

          grep '^CONFIG_TARGET_ROOTFS_INITRAMFS=y$' .config

          echo "===== Important packages ====="

          for p in \
            luci \
            tailscale \
            wireguard-tools \
            tcpdump \
            ethtool
          do
            grep -E "^CONFIG_PACKAGE_${p}=y$" .config || {
              echo "Missing package: $p"
              exit 1
            }
          done

          echo "===== DAE standalone mode check ====="

          for p in dae luci-app-dae; do
            if grep -q "^CONFIG_PACKAGE_${p}=y$" .config; then
              echo "ERROR: ${p} must be installed separately"
              exit 1
            fi
          done

          echo "OK: DAE will be installed separately"

      # 6. Download source packages
      - name: Download sources
        run: |
          cd openwrt

          make download -j8

      # 7. Compile
      - name: Compile firmware
        run: |
          cd openwrt

          make -j"$(nproc)" || make -j1 V=s

      # 8. Verify firmware and prepare release files
      - name: Verify firmware
        shell: bash
        run: |
          cd openwrt/bin/targets/mediatek/filogic

          echo "===== All firmware files ====="
          ls -lh

          echo "===== Required artifacts ====="

          for pattern in \
            '*ubootmod-preloader.bin' \
            '*ubootmod-bl31-uboot.fip' \
            '*ubootmod-initramfs-factory.ubi' \
            '*ubootmod-initramfs-recovery.itb' \
            '*ubootmod-squashfs-sysupgrade.itb'
          do
            if ! compgen -G "$pattern" > /dev/null; then
              echo "ERROR: Missing artifact: $pattern"
              exit 1
            fi

            echo "OK: $pattern"
          done

          echo "===== Prepare release directory ====="

          mkdir -p "$GITHUB_WORKSPACE/release-assets"

          cp *xiaomi_redmi-router-ax6000-ubootmod* \
            "$GITHUB_WORKSPACE/release-assets/"

          cp config.buildinfo \
             feeds.buildinfo \
             version.buildinfo \
             profiles.json \
             "$GITHUB_WORKSPACE/release-assets/"

          cd "$GITHUB_WORKSPACE/release-assets"

          echo "===== Generate SHA256 ====="

          sha256sum *ubootmod* > sha256sums.txt

          echo "===== Release files ====="
          ls -lh

          echo "===== SHA256 ====="
          cat sha256sums.txt

      # 9. Generate unique release tag
      - name: Generate release metadata
        id: release_meta
        run: |
          TAG="ax6000-ubootmod-${OPENWRT_TAG}-build-${GITHUB_RUN_NUMBER}"

          echo "tag_name=$TAG" >> "$GITHUB_OUTPUT"

          echo "Release tag: $TAG"

      # 10. Upload Actions artifact
      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: Redmi-AX6000-U-Boot-Mod
          path: release-assets/*
          if-no-files-found: error
          retention-days: 30

      # 11. Create GitHub Release
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.release_meta.outputs.tag_name }}
          name: Redmi AX6000 U-Boot Mod - OpenWrt ${{ env.OPENWRT_TAG }} - Build ${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          prerelease: true
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            release-assets/*
