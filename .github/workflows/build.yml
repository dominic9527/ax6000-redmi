
name: Redmi AX6000 U-Boot Mod Build

on:
  workflow_dispatch:

  push:
    branches:
      - main
    paths:
      - '.config'
      - '.github/workflows/build.yml'

permissions:
  contents: read

jobs:
  build:
    name: AX6000 U-Boot Mod
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    env:
      OPENWRT_TAG: v25.12.6

    steps:

      # 1. Get your configuration repository
      - name: Checkout config
        uses: actions/checkout@v4

      # 2. Install dependencies
      - name: Install build dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            build-essential \
            clang \
            flex \
            bison \
            g++ \
            gawk \
            gcc-multilib \
            g++-multilib \
            gettext \
            git \
            libncurses-dev \
            libssl-dev \
            python3 \
            python3-setuptools \
            rsync \
            unzip \
            zlib1g-dev \
            file \
            wget \
            curl \
            ccache

      # 3. Clone official OpenWrt source
      - name: Clone OpenWrt
        run: |
          git clone \
            --depth 1 \
            --branch "$OPENWRT_TAG" \
            https://github.com/openwrt/openwrt.git \
            openwrt

      # 4. Update package feeds
      - name: Update feeds
        run: |
          cd openwrt

          ./scripts/feeds update -a
          ./scripts/feeds install -a

      # 5. Load configuration
      - name: Configure firmware
        run: |
          cp .config openwrt/.config

          cd openwrt

          make defconfig

          echo "===== Target check ====="

          grep -E \
            '^CONFIG_TARGET_mediatek_filogic_DEVICE_xiaomi_redmi-router-ax6000-ubootmod=y$' \
            .config

          echo "===== Initramfs check ====="

          grep '^CONFIG_TARGET_ROOTFS_INITRAMFS=y$' .config

          echo "===== Important packages ====="

          for p in \
            luci \
            tailscale \
            wireguard-tools \
            tcpdump \
            ethtool
          do
            grep -E "^CONFIG_PACKAGE_${p}=y$" .config || {
              echo "Missing package: $p"
              exit 1
            }
          done

      # 6. Download source packages
      - name: Download sources
        run: |
          cd openwrt

          make download -j8

      # 7. Compile
      - name: Compile firmware
        run: |
          cd openwrt

          make -j"$(nproc)" || make -j1 V=s

      # 8. Verify output
      - name: Verify firmware
        run: |
          cd openwrt/bin/targets/mediatek/filogic

          echo "===== All firmware files ====="
          ls -lh

          echo "===== Required artifacts ====="

          for f in \
            *ubootmod-preloader.bin \
            *ubootmod-bl31-uboot.fip \
            *ubootmod-initramfs-factory.ubi \
            *ubootmod-initramfs-recovery.itb \
            *ubootmod-squashfs-sysupgrade.itb
          do
            test -f "$f" || {
              echo "Missing artifact: $f"
              exit 1
            }
          done

          sha256sum * > sha256sums.txt

          echo "===== SHA256 ====="
          cat sha256sums.txt

      # 9. Upload
      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: Redmi-AX6000-U-Boot-Mod
          path: |
            openwrt/bin/targets/mediatek/filogic/
          if-no-files-found: error
          retention-days: 30
